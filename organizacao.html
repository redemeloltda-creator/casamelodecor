<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organização | Casa Melo Decor</title>

<style>
body{
    font-family:Arial, sans-serif;
    background:#fff7f7;
    margin:0;
}

/* TOPO */
header{
    background:#000;
    color:#fff;
    text-align:center;
    padding:20px;
}

header a{
    color:#fff;
    text-decoration:none;
    font-size:14px;
}

.logo-link{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    margin-bottom:10px;
    background:#fff;
    padding:8px 12px;
    border-radius:10px;
}

.logo-link img{
    width:90px;
    height:auto;
}

/* CONTEÚDO */
.section{
    padding:40px 20px;
    text-align:center;
}

.produtos{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(200px, 220px));
    justify-content:center;
    gap:18px;
}

.produto{
    background:#fff;
    border-radius:8px;
    box-shadow:0 1px 5px rgba(0,0,0,0.08);
    border:1px solid #f1e1e1;
    overflow:hidden;
}

.produto img{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
}

.produto div{
    padding:10px;
}

/* BOTÃO */
.botao{
    display:inline-block;
    margin-top:8px;
    padding:8px 12px;
    background:#000;
    color:#fff;
    text-decoration:none;
    border-radius:4px;
    font-weight:bold;
}

/* BARRA DE BUSCA */
.busca-container {
    position: relative;
    max-width: 650px;
    margin: 20px auto;
}

#campoBusca {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    border-radius: 8px;
    border: 1px solid #ccc;
    outline: none;
}

#campoBusca:focus {
    border-color: #000;
}

.resultados {
    position: absolute;
    width: 100%;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    max-height: 450px;
    overflow-y: auto;
    display: none;
    z-index: 999;
    text-align: left;
}

.resultado-item {
    display: flex;
    gap: 15px;
    padding: 12px;
    cursor: pointer;
    transition: 0.2s;
}

.resultado-item:hover,
.resultado-item.ativo {
    background: #f3f3f3;
}

.resultado-item img {
    width: 65px;
    height: 65px;
    object-fit: cover;
    border-radius: 6px;
}

.resultado-info h4 {
    margin: 0;
    font-size: 14px;
}

.resultado-info p {
    margin: 2px 0;
    font-size: 12px;
    color: #666;
}

.highlight {
    background: yellow;
    font-weight: bold;
}

.sem-resultado {
    padding: 15px;
    text-align: center;
    color: #777;
}

</style>
</head>

<body>

<header>
    <a class="logo-link" href="index.html" aria-label="Voltar para a página inicial">
        <img src="logo.png" alt="Casa Melo Decor">
    </a>
    <h2>Catálogo de Organização</h2>
    <a href="index.html">← Voltar para o site</a>
</header>

<section class="section">

    <div class="busca-container">
      <input type="text" id="campoBusca" placeholder="Buscar produtos..." autocomplete="off">
      <div id="resultadosBusca" class="resultados"></div>
    </div>

<div class="produtos">

        <div class="produto">
            <img src="https://images.unsplash.com/photo-1582582429416-6b3a2bcd1c4d">
            <div>
                <h3>Caixas Organizadoras</h3>
                <p>Ideal para armários e prateleiras</p>
                <a class="botao" href="https://wa.me/5538999140400?text=Tenho interesse nas Caixas Organizadoras" target="_blank">
                    Consultar
                </a>
            </div>
        </div>

        <div class="produto">
            <img src="https://images.unsplash.com/photo-1598300053653-1c3c0a1e5a52">
            <div>
                <h3>Organizador de Gavetas</h3>
                <p>Mais praticidade no dia a dia</p>
                <a class="botao" href="https://wa.me/5538999140400?text=Tenho interesse no Organizador de Gavetas" target="_blank">
                    Consultar
                </a>
            </div>
        </div>

        <div class="produto">
            <img src="https://images.unsplash.com/photo-1600210492493-0946911123ea">
            <div>
                <h3>Cestos Multiuso</h3>
                <p>Funcionalidade com estilo</p>
                <a class="botao" href="https://wa.me/5538999140400?text=Tenho interesse nos Cestos Multiuso" target="_blank">
                    Consultar
                </a>
            </div>
        </div>

        <div class="produto">
            <img src="https://images.unsplash.com/photo-1600607687644-c7f34b3c06e3">
            <div>
                <h3>Organizador de Armário</h3>
                <p>Mais espaço e organização</p>
                <a class="botao" href="https://wa.me/5538999140400?text=Tenho interesse no Organizador de Armário" target="_blank">
                    Consultar
                </a>
            </div>
        </div>

    </div>


</section>

<script src="catalog-search.js"></script>

</body>
</html>
